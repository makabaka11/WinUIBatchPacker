name: Build WinUI

on:
  push:
    paths:
      - "WinUIBatchPacker/**"
      - ".github/workflows/winui-build.yml"
  pull_request:
    paths:
      - "WinUIBatchPacker/**"
      - ".github/workflows/winui-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winui-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-win-x64:
    name: Build compact win-x64
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh
        working-directory: WinUIBatchPacker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Show build environment
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore WinUIBatchPacker.csproj -r win-x64 -p:Platform=x64

      - name: Publish WinUI app
        run: >-
          dotnet publish WinUIBatchPacker.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --no-restore
          -p:Platform=x64
          -p:ContinuousIntegrationBuild=true
          --output "${{ github.workspace }}\artifacts\WinUIBatchPacker-win-x64"

      - name: Verify publish output
        run: |
          $exe = "${{ github.workspace }}\artifacts\WinUIBatchPacker-win-x64\WinUIBatchPacker.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Expected executable was not generated: $exe"
          }
          $files = @(Get-ChildItem "${{ github.workspace }}\artifacts\WinUIBatchPacker-win-x64" -File -Recurse)
          $size = ($files | Measure-Object Length -Sum).Sum
          if ($size -gt 45MB) {
            throw "Framework-dependent artifact is unexpectedly large: $size bytes"
          }
          Write-Host "Framework-dependent publish size: $size bytes ($($files.Count) files)"
          Get-ChildItem "${{ github.workspace }}\artifacts\WinUIBatchPacker-win-x64" |
            Select-Object Name, Length

      - name: Package zip
        run: |
          $dest = "${{ github.workspace }}\artifacts"
          $staging = "${{ github.workspace }}\artifacts\WinUIBatchPacker-win-x64"
          Compress-Archive -Path "$staging\*" -DestinationPath "$dest\WinUIBatchPacker-win-x64.zip" -Force
          Get-Item "$dest\WinUIBatchPacker-win-x64.zip" |
            Select-Object Name, @{N='MB'; E={[math]::Round($_.Length/1MB,1)}}

      - name: Upload win-x64 zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinUIBatchPacker-win-x64-${{ github.run_number }}
          path: artifacts/WinUIBatchPacker-win-x64.zip
          if-no-files-found: error
          retention-days: 14
